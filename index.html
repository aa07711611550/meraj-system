<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام معراج للعقار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وفخم ومهني — مكتب عقار يثق بيه الزبون والشريك
   IDEA: ملف عقار مرتب: بطاقة لكل عقار، ودفتر حسابات واضح
   PICTURE: صورة العقار نفسها هي البطل؛ برج معراج علامة خفيفة
   COLOUR and TYPE: ذهبي معراج #C39A5E، عاجي، فحمي؛ IBM Plex Sans Arabic
   LAYOUT: الإدارة: شريط جانبي يمين ومحتوى؛ الزبون: شبكة بطاقات بعرض كامل */
:root{color-scheme:light dark;
--bg:light-dark(#F8F5EF,#0D0F12);--card:light-dark(#FFFFFF,#16191D);--ink:light-dark(#15171A,#F2EDE4);
--mute:light-dark(#66625B,#A49D92);--line:light-dark(#E8E0D0,#2A2E33);--soft:light-dark(#F1EBDF,#1F2327);
--gold:#B8893A;--gold-d:light-dark(#7C5820,#E2C07A);--char:#111417;--goldg:linear-gradient(135deg,#EBCB86,#B8893A 55%,#8A6224);
--ok:light-dark(#2F7D57,#6FC79A);--bad:light-dark(#B3412F,#F08B79);--warn:light-dark(#9A6B12,#E9BF64)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3vw,34px)}h2{font-size:22px}h3{font-size:17px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.mute{color:var(--mute)}.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--char);color:#F6F2EA;border-color:var(--char)}
:root[data-theme=dark] .btn.pri,.btn.gold{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}}
.btn.danger{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:13px;color:var(--gold-d);min-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--soft);white-space:nowrap}
.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}.t-gold{color:var(--gold-d)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mute);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
/* admin shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--char);color:#EDE6DA;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand img{height:44px}
.brand b{font-size:17px;display:block}.brand span{font-size:12.5px;color:#B9AEA0}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:11px 14px;border-radius:10px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:#ffffff12}
.nav button.on{background:var(--gold);color:#1b1b1b;font-weight:700}
.side .foot{margin-top:auto;font-size:12.5px;color:#B9AEA0;padding:0 8px}
.main{padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;gap:20px;max-width:1300px;width:100%}
.kpi b{display:block;font-size:clamp(20px,2.4vw,28px);font-weight:700}
.kpi>span{font-size:14px;color:var(--mute)}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--gold)}
.ph{aspect-ratio:4/3;background:var(--soft);position:relative;display:grid;place-items:center;overflow:hidden}
.ph img.cover{width:100%;height:100%;object-fit:cover}
.ph img.tw{height:46%;opacity:.35}
.ph .badge{position:absolute;top:12px;inset-inline-start:12px}
.sold-ribbon{position:absolute;inset:auto 0 0 0;background:#2B2F33E6;color:#F3D9A9;text-align:center;font-weight:700;padding:8px;font-size:17px}
.pc .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .price{font-size:19px;font-weight:700;color:var(--gold-d)}
.specs{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:50}
.md{background:var(--card);border-radius:18px;width:min(860px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.md.narrow{width:min(520px,100%)}
.md header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.md fieldset{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;display:grid;gap:12px}
.md legend{font-weight:700;padding:0 6px;color:var(--gold-d)}
.x{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;font-size:22px}
.x:hover{background:var(--soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative;width:92px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:6px;border:0;background:#000a;color:#fff;cursor:pointer}
.gal{display:grid;gap:8px}
.gal .big{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--soft);display:grid;place-items:center}
.gal .big img{width:100%;height:100%;object-fit:cover}
.gal .thumbs .t{cursor:pointer}
.calc{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.calc div{display:flex;justify-content:space-between;gap:10px}
.calc .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.share{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1.3fr 44px;gap:8px;align-items:end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:12px 20px;border-radius:12px;z-index:90;font-weight:600}
.switch{position:fixed;bottom:16px;left:16px;z-index:40;display:flex;background:var(--char);border-radius:99px;padding:4px;box-shadow:0 6px 20px #0003}
.switch a{color:#EDE6DA;text-decoration:none;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600}
.switch a.on{background:var(--gold);color:#1b1b1b}
.note{border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;font-size:14.5px}
/* store */
.st-top{display:flex;justify-content:space-between;align-items:center;padding:14px max(5vw,16px);background:var(--card);border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.st-top img{height:54px}
.hero{background:var(--char);color:#F3EDE3;padding:clamp(30px,5vw,64px) max(5vw,16px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,4.4vw,50px);line-height:1.1;color:#F3D9A9}
.hero p{max-width:52ch;color:#D8D0C3;font-size:17px}
.hero .tower{justify-self:center;height:clamp(140px,22vw,260px);filter:drop-shadow(0 20px 30px #0006)}
.hero .stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.hero .stats b{display:block;font-size:28px;color:#fff}
.hero .stats span{font-size:14px;color:#B9AEA0}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px);max-width:1340px;margin:0 auto}
.st-foot{background:var(--char);color:#D8D0C3;padding:28px max(5vw,16px);text-align:center;font-size:14.5px}
@media(max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:30;gap:10px}
 .side .foot,.brand div{display:none}
 .nav{flex-direction:row;overflow-x:auto}
 .nav button{white-space:nowrap;padding:9px 12px}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .filters{grid-template-columns:1fr 1fr}
 .hero{grid-template-columns:1fr}.hero .tower{display:none}
}
@media(max-width:600px){
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 .filters{grid-template-columns:1fr}
 .share{grid-template-columns:1fr 1fr}.share>:first-child{grid-column:1/-1}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}
}
@media(prefers-reduced-motion:reduce){.pc{transition:none}.pc:hover{transform:none}}

.brand .blogo{width:100%;max-width:190px;height:auto;max-height:84px;object-fit:contain;filter:drop-shadow(0 4px 10px #0008)}.brand .bsub{font-size:12.5px;color:#B9AEA0;letter-spacing:.3px}.brand{display:grid!important;justify-items:center;gap:4px}
@media(max-width:900px){.brand .blogo{max-height:40px;max-width:110px}.brand .bsub{display:none}}
a.btn{text-decoration:none}a.btn:not(.gold):not(.pri){color:var(--ink)}
/* store v2: depth */
.tk{display:flex;align-items:stretch;background:#0B0D10;color:#F2EDE4;border-bottom:1px solid #E2C07A33;overflow:hidden;position:relative;z-index:6}
.tk-lbl{flex:none;display:grid;place-items:center;padding:0 16px;background:var(--goldg);color:#17130B;font-weight:800;font-size:14px;z-index:2;box-shadow:-10px 0 24px #000a}
.tk-vp{flex:1;overflow:hidden;direction:ltr;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tk-tr{display:flex;width:max-content;animation:tick linear infinite}.tk-vp:hover .tk-tr,.tk-vp:focus-within .tk-tr{animation-play-state:paused}
.tk-h{display:flex}
@keyframes tick{to{transform:translateX(-50%)}}
.tk-i{direction:rtl;display:flex;align-items:center;gap:10px;padding:8px 18px;border:0;border-inline-end:1px solid #ffffff14;background:none;color:inherit;cursor:pointer;white-space:nowrap;font-size:14px}
.tk-i img{width:46px;height:34px;border-radius:6px;object-fit:cover;box-shadow:0 4px 10px #0008}.tk-i img.tw{object-fit:contain;background:#1b1e22;padding:3px}
.tk-i b{font-weight:700}.tk-p{color:#E2C07A;font-weight:700}.tk-m{color:#A49D92;font-size:13px}
.tk-star{font-size:11px;font-weight:800;color:#17130B;background:#E2C07A;border-radius:99px;padding:1px 8px}
.st-top{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);background:color-mix(in srgb,var(--card) 82%,transparent)}
.st-top .row{gap:8px}
.hero{background:radial-gradient(ellipse at 85% -10%,#B8893A55,transparent 55%),radial-gradient(ellipse at -10% 110%,#B8893A30,transparent 50%),linear-gradient(160deg,#171B20,#0A0C0F 70%);padding-bottom:clamp(70px,8vw,110px);isolation:isolate}
.hero::after{content:"";position:absolute;inset:auto -30% -45% -30%;height:75%;background:linear-gradient(#E2C07A26 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,#E2C07A26 1px,transparent 1px) 0 0/64px 64px;transform:perspective(520px) rotateX(64deg);mask-image:linear-gradient(transparent,#000 65%);pointer-events:none;z-index:-1}
.hero h1{background:linear-gradient(90deg,#F7E3B2,#D4A955);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.hero .stats>div{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:14px;padding:10px 18px;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 #ffffff1a}
.h3d{perspective:1400px;position:relative;height:clamp(240px,28vw,360px);transform-style:preserve-3d}
.h3d .tower{position:absolute;inset:0;margin:auto;height:90%;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 30px 40px #000c)}
.hc{position:absolute;width:64%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid #ffffff2a;padding:0;cursor:pointer;background:#111;box-shadow:0 40px 70px -20px #000d,0 0 0 1px #E2C07A33;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .4s;animation:fl 7s ease-in-out infinite}
.hc img{width:100%;height:100%;object-fit:cover;display:block}
.hc span{position:absolute;inset:auto 0 0 0;padding:26px 14px 10px;background:linear-gradient(transparent,#000d);color:#fff;text-align:start;display:grid;font-size:14px}.hc span b{font-size:15px}.hc .num{color:#E2C07A;font-weight:700}
.hc0{inset-inline-start:2%;top:20%;z-index:3;transform:rotateY(-20deg) rotateX(5deg) translateZ(80px)}
.hc1{inset-inline-start:24%;top:7%;z-index:2;transform:rotateY(-20deg) rotateX(5deg) translateZ(0);filter:brightness(.72);animation-delay:-2s}
.hc2{inset-inline-start:44%;top:-5%;z-index:1;transform:rotateY(-20deg) rotateX(5deg) translateZ(-90px);filter:brightness(.5);animation-delay:-4s}
.h3d:hover .hc{filter:brightness(.6)}.h3d .hc:hover{filter:none;transform:rotateY(-8deg) rotateX(2deg) translateZ(120px);z-index:4}
@keyframes fl{50%{translate:0 -12px}}
.sbox{max-width:1180px;margin:-52px auto 0;position:relative;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:10px;box-shadow:0 30px 60px -28px #000a,0 1px 0 #fff3 inset}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;min-height:40px;padding:0 18px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--char);color:#F7E3B2;box-shadow:0 6px 14px -6px #000a}
:root[data-theme=dark] .seg button.on{background:var(--gold);color:#17130B}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:34px 0 16px}.sec-h h2{font-size:clamp(22px,2.4vw,28px)}
.pc{position:relative}
.pc.tilt{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;box-shadow:0 18px 40px -26px #0007;will-change:transform}
.pc.tilt:hover{transform:translateY(-4px)}
.pc.tilt.tilting{transition:transform .08s linear,box-shadow .2s;box-shadow:0 34px 60px -26px #000a;border-color:var(--gold)}
.pc.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),#ffffff33,transparent 45%);opacity:0;transition:opacity .25s;pointer-events:none}
.pc.tilt.tilting::after{opacity:1}
.pc.tilt .ph img.cover{transition:transform .6s}.pc.tilt:hover .ph img.cover{transform:scale(1.06)}
.fstar{position:absolute;top:12px;inset-inline-end:12px;background:var(--goldg);color:#17130B;font-weight:800;font-size:12.5px;padding:3px 10px;border-radius:99px;box-shadow:0 6px 14px -4px #0009}
.pcode{font-size:12px;color:var(--mute)}
.st-foot{background:#0B0D10;display:grid;gap:6px}.st-foot b{color:#E2C07A}
@media(max-width:900px){.sbox{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sbox .seg{grid-column:1/-1}.sbox #sq{grid-column:1/-1}.h3d{height:260px}}
@media(max-width:900px){.hero{padding:26px 18px 64px;gap:0}.hero .h3d{display:none}}
@media(max-width:600px){.hero h1{font-size:26px;padding-bottom:2px}.hero p{font-size:15px;line-height:1.7;margin:8px 0 0}.hero .stats{gap:8px;margin-top:14px;flex-wrap:nowrap}.hero .stats>div{flex:1;padding:8px 10px;border-radius:12px;text-align:center}.hero .stats b{font-size:20px}.hero .stats span{font-size:12.5px}.sbox{margin-top:-40px}}
@media(max-width:600px){.hc{width:78%}.tk-m{display:none}.st-top{flex-wrap:nowrap;padding:8px 12px}.st-top img{height:36px}.st-top .btn{min-height:38px;padding:0 12px;font-size:14px}.st-top .btn .num,.st-top .btn .lbl-n{display:none}}
@media(prefers-reduced-motion:reduce){.tk-tr{animation:none}.tk-vp{overflow-x:auto}.hc,.h3d .tower{animation:none}.pc.tilt,.pc.tilt.tilting{transform:none!important}}
/* contract editor */
.ce-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0}
.seg.big button{min-height:46px;font-size:16px;padding:0 22px}
.ce{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
.ce-form fieldset{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;display:grid;gap:12px;background:var(--card)}
.ce-form legend{font-weight:700;padding:0 6px;color:var(--gold-d)}
.ce-pick{background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:10px;border:1px dashed var(--gold)}
.ce-pv{position:sticky;top:70px}.ce-pvh{margin-bottom:6px}
.ce-sheet{border-radius:6px;overflow:hidden;box-shadow:0 20px 50px -20px #0008;background:#fff}
.ce-sheet .ct{box-shadow:none;margin:0}
@media(max-width:1100px){.ce{grid-template-columns:minmax(0,1fr)}.ce-pv{position:static}}
#print.sil{display:none}
/* stats */
.bars{display:flex;align-items:end;gap:3px;height:150px;padding-top:8px}
.bars div{flex:1;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--gold-d)}
.hbar{height:7px;background:var(--soft);border-radius:4px;margin-top:4px}.hbar i{display:block;height:100%;background:var(--gold);border-radius:4px}

/* featured stage: 10 modes */
.feat{padding:22px max(4vw,14px) 10px;max-width:1400px;margin:0 auto;overflow:hidden}
.fs{position:relative;height:clamp(250px,40vw,470px);perspective:1500px;transform-style:preserve-3d;--sp:5s;touch-action:pan-y;user-select:none}
.fsl{position:absolute;inset:0;margin:auto;border-radius:24px;overflow:hidden;background:#111;cursor:pointer;opacity:0;pointer-events:none;transition:transform .9s cubic-bezier(.22,.7,.18,1),opacity .9s,filter .9s;backface-visibility:hidden;box-shadow:0 30px 60px -30px #000c;z-index:calc(5 - var(--a,3))}
.fsl[data-o="0"]{opacity:1;pointer-events:auto}
.fsi,.fsi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fsi img.tw{object-fit:contain;padding:12%;background:#1b1e22}
.fsl::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000d 0%,#0006 38%,transparent 65%);pointer-events:none}
.fsc{position:absolute;inset:auto 0 0 0;z-index:2;padding:clamp(16px,3vw,34px) clamp(16px,3vw,34px) clamp(30px,3.4vw,44px);padding-inline:clamp(16px,6vw,78px);color:#fff;display:grid;gap:4px;justify-items:start}
.fsc h3{font-size:clamp(20px,2.8vw,34px);line-height:1.2}.fsm{color:#E9E2D6;font-size:14.5px}.fsp{font-size:clamp(20px,2.4vw,28px);color:#F2D08A}.fsc .btn{margin-top:6px;pointer-events:none}
.fsb{background:var(--goldg);color:#17130B;font-weight:800;font-size:12.5px;padding:3px 12px;border-radius:99px}
.fsn{position:absolute;top:50%;translate:0 -50%;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff55;background:#0008;color:#fff;font-size:26px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
.fsn.prev{inset-inline-start:12px}.fsn.next{inset-inline-end:12px}.fsn:hover{background:var(--gold);color:#17130B}
.fsd{position:absolute;inset:auto 0 14px 0;display:flex;justify-content:center;gap:7px;z-index:9}
.fsd button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:#ffffff70;cursor:pointer;transition:width .4s,background .4s}.fsd button.on{width:26px;background:var(--gold)}

/* 1 tamata: rounded banners, next one peeking */
.fs[data-mode=tamata] .fsl{width:86%;opacity:1;pointer-events:auto;transform:translateX(calc(var(--o)*-91%)) scale(calc(1 - var(--a)*.08));filter:brightness(calc(1 - var(--a)*.3))}
.fs[data-mode=tamata] .fsl[data-o=far]{opacity:0}
.fs[data-mode=tamata]{overflow:hidden;border-radius:24px}
/* 2 slide */
.fs[data-mode=slide]{overflow:hidden;border-radius:24px}.fs[data-mode=slide] .fsl{opacity:1;transform:translateX(calc(var(--o)*-101%))}
/* 3 fade */
.fs[data-mode=fade] .fsl{transition:opacity 1.2s ease}
/* 4 ken burns */
.fs[data-mode=kenburns] .fsl{transition:opacity 1.4s ease}.fs[data-mode=kenburns] .fsl[data-o="0"] .fsi img{animation:kb calc(var(--sp) + 1.4s) ease-out forwards}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.16) translate(-2%,-2%)}}
/* 5 coverflow */
.fs[data-mode=coverflow] .fsl{width:58%;opacity:calc(1 - var(--a)*.25);pointer-events:auto;transform:translateX(calc(var(--o)*-58%)) translateZ(calc(var(--a)*-220px)) rotateY(calc(var(--o)*42deg));filter:brightness(calc(1 - var(--a)*.28))}
.fs[data-mode=coverflow] .fsl[data-o=far]{opacity:0;pointer-events:none}
/* 6 cube */
.fs[data-mode=cube]{perspective:1800px}.fs[data-mode=cube] .fsl{width:78%;transform:translateZ(calc(var(--hw)*-.78)) rotateY(calc(var(--o)*90deg)) translateZ(calc(var(--hw)*.78));transition:transform 1.1s cubic-bezier(.6,0,.3,1),opacity 1.1s}
.fs[data-mode=cube] .fsl[data-o="1"],.fs[data-mode=cube] .fsl[data-o="-1"]{opacity:1}
/* 7 stacked cards */
.fs[data-mode=stack] .fsl{width:84%;transform:translateY(calc(var(--a)*-22px)) scale(calc(1 - var(--a)*.07));opacity:calc(1 - var(--a)*.25);filter:brightness(calc(1 - var(--a)*.25))}
.fs[data-mode=stack] .fsl[data-o^="-"]{opacity:0;transform:translateX(-120%) rotate(-8deg)}.fs[data-mode=stack] .fsl[data-o=far]{opacity:0}
/* 8 flip */
.fs[data-mode=flip] .fsl{width:84%;transform:rotateX(calc(var(--o)*-100deg));transform-origin:50% 50%;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .5s}
/* 9 3D ring */
.fs[data-mode=ring]{perspective:2000px}.fs[data-mode=ring] .fsl{width:50%;opacity:calc(1 - var(--a)*.3);pointer-events:auto;transform:translateZ(calc(var(--R)*-1)) rotateY(calc(var(--o)*-42deg)) translateZ(var(--R));filter:brightness(calc(1 - var(--a)*.3))}
.fs[data-mode=ring] .fsl[data-o=far]{opacity:0;pointer-events:none}
@media(max-width:700px){.fs[data-mode=coverflow] .fsl,.fs[data-mode=ring] .fsl{width:72%}.fsn{display:none}.fsc .btn{display:none}}
@media(prefers-reduced-motion:reduce){.fsl{transition:opacity .3s!important}.fs[data-mode=kenburns] .fsl .fsi img{animation:none!important}}

function partnerBal(pid){const r={cap:0,inc:0,exp:0,wd:0};for(const t of S.tx){if(t.partnerId!==pid)continue;const a=num(t.amount);
 if(t.kind==='capital_in')r.cap+=a;else if(t.kind==='inc_partner')r.inc+=a;else if(t.kind==='exp_partner')r.exp+=a;else if(t.kind==='withdraw')r.wd+=a}
 r.bal=r.cap+r.inc-r.exp-r.wd;return r}
function office(){let inc=0,exp=0,pend=0;for(const t of S.tx){const a=num(t.amount);if(t.kind==='inc_office')inc+=a;else if(t.kind==='exp_office')exp+=a;else if(t.kind==='exp_property'){const p=byId('properties',t.propertyId);if(!p||!p.sale)pend+=a}}return{inc,exp,net:inc-exp,pend}}

function openModal(html,narrow){const m=$('#modal');m.innerHTML=`<div class="ov"><div class="md ${narrow?'narrow':''}" role="dialog" aria-modal="true">${html}</div></div>`;
 const ov=$('.ov',m);ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
 ov.querySelectorAll('input.money').forEach(moneyHint);const f=ov.querySelector('input,select,textarea');if(f)f.focus();return $('.md',m)}
function closeModal(){$('#modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
function ask(msg,ok='تأكيد'){return new Promise(res=>{const md=openModal(`<header><h2>تأكيد</h2></header><p>${msg}</p><div class="row"><button class="btn pri" id="y">${ok}</button><button class="btn" id="n">رجوع</button></div>`,true);
 $('#y',md).onclick=()=>{closeModal();res(true)};$('#n',md).onclick=()=>{closeModal();res(false)}})}
function moneyHint(i){const h=document.createElement('div');h.className='hint';i.after(h);const u=()=>{h.textContent=i.value?fmt(num(i.value))+' دينار':''};i.addEventListener('input',u);u()}
const opts=(arr,sel,ph)=>(ph!=null?`<option value="">${ph}</option>`:'')+arr.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(t)}</option>`}).join('');
const fld=(n,l,v,{type='text',req,ph='',money,cls=''}={})=>`<div class="${cls}"><label for="f_${n}" class="${req?'req':''}">${l}</label><input id="f_${n}" name="${n}" type="${money?'text':type}" ${money?'inputmode="numeric" class="money"':''} value="${esc(v??'')}" placeholder="${esc(ph)}" ${req?'required':''}></div>`;
const sel=(n,l,arr,v,{req,ph}={})=>`<div><label for="f_${n}" class="${req?'req':''}">${l}</label><select id="f_${n}" name="${n}" ${req?'required':''}>${opts(arr,v,ph)}</select></div>`;
const formData=f=>Object.fromEntries(new FormData(f).entries());
function compress(file,max=1100,q=.68){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let d=c.toDataURL('image/jpeg',q);if(d.length>230000)d=c.toDataURL('image/jpeg',.5);URL.revokeObjectURL(u);res(d)};img.onerror=rej;img.src=u})}

function saleForm(p){

 const md=openModal(`<header><h2>${rent?'تسجيل تأجير':'تسجيل بيع'}: ${esc(p.title)}</h2><button class="x" data-close aria-label="إغلاق">×</button></header>

 ${sel('buyer',rent?'المستأجر':'المشتري',S.clients.map(c=>[c.id,c.name]),'',{ph:'— اختياري —'})}</div>
 ${inv?'':fld('comm','العمولة المستلمة للمكتب',rent?'':'',{req:1,money:1})}
 <div class="calc" id="calc"></div>
 <fieldset><legend>حصص الشركاء من الربح</legend><div id="rows" class="grid"></div>

 <div class="calc" id="tot"></div>
 <div class="note small">بعد الحفظ: حصة المكتب تنسجل إيراد عام، وحصة كل شريك تنسجل إيراد خاص بكشف حسابه، والعقار يصير "${rent?'مؤجر':'مباع'}" ويظهر للزبون "${rent?'تم التأجير':'تم البيع'}".</div>

 const drawRows=()=>{$('#rows',md).innerHTML=rows.map((r,i)=>`<div class="share"><div><label>الشريك</label><select data-i="${i}" data-k="partnerId">${opts(S.partners.map(x=>[x.id,x.name]),r.partnerId,'اختر…')}</select></div>
  <div><label>الطريقة</label><select data-i="${i}" data-k="mode">${opts([['pct','نسبة %'],['fixed','مبلغ ثابت']],r.mode)}</select></div>
  <div><label>${r.mode==='pct'?'النسبة %':'المبلغ'}</label><input data-i="${i}" data-k="value" inputmode="decimal" value="${esc(r.value)}"></div>
  <div><label>الحصة</label><div class="calc" style="min-height:44px;padding:10px"><span class="num" data-amt="${i}"></span></div></div>
  <button type="button" class="x" data-del="${i}" aria-label="حذف">×</button></div>`).join('');
  md.querySelectorAll('#rows [data-k]').forEach(el=>el.oninput=el.onchange=()=>{rows[+el.dataset.i][el.dataset.k]=el.value;if(el.dataset.k==='mode')drawRows();else calc()});
  md.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);drawRows()});calc()};
 const amt=r=>r.mode==='pct'?profit()*num(r.value)/100:num(r.value);
 function calc(){const pr=profit();rows.forEach((r,i)=>{const e=$(`[data-amt="${i}"]`,md);if(e)e.textContent=fmt(amt(r))});
  $('#calc',md).innerHTML=inv?`<div><span>سعر ${rent?'الإيجار':'البيع'}</span><span>${IQD(f.price.value)}</span></div><div><span>ناقص كلفة الشراء</span><span>${IQD(p.cost)}</span></div><div><span>ناقص المصروفات الخاصة على العقار</span><span>${IQD(exT)}</span></div><div class="tot"><span>الربح الصافي</span><span>${IQD(pr)}</span></div>`
  :`<div><span>العمولة</span><span>${IQD(f.comm.value)}</span></div><div><span>ناقص المصروفات الخاصة على العقار</span><span>${IQD(exT)}</span></div><div class="tot"><span>الربح الصافي</span><span>${IQD(pr)}</span></div>`;
  const ps=rows.reduce((a,r)=>a+amt(r),0),of=pr-ps;

 f.price.oninput=calc;if(f.comm)f.comm.addEventListener('input',calc);
 $('#addR',md).onclick=()=>{rows.push({partnerId:'',mode:'pct',value:''});drawRows()};drawRows();
 f.onsubmit=async e=>{e.preventDefault();
  if(rows.some(r=>!r.partnerId||!num(r.value)))return toast('كمّل بيانات كل شريك أو احذف السطر');
  if(new Set(rows.map(r=>r.partnerId)).size<rows.length)return toast('نفس الشريك مكرر');
  const pr=profit(),shares=rows.map(r=>({partnerId:r.partnerId,mode:r.mode,value:num(r.value),amount:Math.round(amt(r))})),ps=shares.reduce((a,x)=>a+x.amount,0),of=Math.round(pr-ps);

  const sale={kind,price:num(d.price),date:d.date,buyer:d.buyer||'',comm:inv?0:num(d.comm),cost:inv?num(p.cost):0,expenses:exT,profit:Math.round(pr),shares,office:of};
  f.querySelector('[type=submit]').disabled=true;
  try{if(of)await put('tx',uid(),{kind:of>0?'inc_office':'exp_office',category:of>0?(rent?'ربح تأجير عقار':'ربح بيع عقار'):'خسارة عقار',amount:Math.abs(of),date:d.date,desc:label,propertyId:p.id,saleOf:p.id,auto:true});
   for(const x of shares)if(x.amount)await put('tx',uid(),{kind:x.amount>0?'inc_partner':'exp_partner',category:(x.amount>0?'حصة ربح من ':'حصة خسارة من ')+label,amount:Math.abs(x.amount),date:d.date,partnerId:x.partnerId,propertyId:p.id,saleOf:p.id,auto:true});
   const r={...p,status:rent?'مؤجر':'مباع',sale,soldAt:Date.now()};delete r.id;await put('properties',p.id,r);
   closeModal();toast(rent?'انسجل التأجير ووُزعت الأرباح':'انسجل البيع ووُزعت الأرباح')}catch(_){}}}

function words(n){n=Math.floor(Math.abs(n));if(!n)return'صفر';
 const O=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
 const T=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
 const H=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
 const tri=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(H[h]);if(r){if(r<20)p.push(O[r]);else{const u=r%10;p.push(u?O[u]+' و'+T[Math.floor(r/10)]:T[Math.floor(r/10)])}}return p.join(' و')};
 const G=[[],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];
 const parts=[];let g=0;
 while(n>0&&g<4){const x=n%1000;if(x){let s;if(!g)s=tri(x);else{const[one,two,pl]=G[g];s=x===1?one:x===2?two:x<=10?tri(x)+' '+pl:x===200?'مائتا '+one:tri(x)+' '+one}parts.unshift(s)}n=Math.floor(n/1000);g++}
 return parts.join(' و')}
const inWords=v=>num(v)?words(num(v))+' دينار عراقي لا غير':'';

const FMODES=[['tamata','بانرات بأسلوب طماطة'],['slide','انزلاق أفقي'],['fade','تلاشي ناعم'],['kenburns','تكبير سينمائي'],['coverflow','كفر فلو ثلاثي الأبعاد'],['cube','مكعب يدور'],['stack','بطاقات متراكبة'],['flip','قلب البطاقة'],['ring','دوّارة ثلاثية الأبعاد'],['ticker','شريط متحرك أعلى الصفحة']];
UI.fi=0;
const latestAvail=()=>S.properties.filter(p=>p.published!==false&&!isDone(p)).sort((a,b)=>(!!photosOf(b.id).length-!!photosOf(a.id).length)||(b.createdAt||0)-(a.createdAt||0)).slice(0,6);

 return`<div class="fs" data-mode="${mode}" ${preview?'id="fsPreview"':''} role="region" aria-roledescription="carousel" aria-label="عقارات مميزة">
 ${F.map((p,i)=>{const ph=photosOf(p.id)[0];return`<article class="fsl" data-i="${i}" data-view="${p.id}" tabindex="-1"><div class="fsi">${ph?`<img src="${ph.data}" alt="${esc(p.title)}">`:`<img class="tw" src="${TOWER}" alt="">`}</div>
 <div class="fsc"><span class="fsb">${fb?'جديد':'★ مميز'} · ${esc(p.purpose)}</span><h3>${esc(p.title)}</h3><span class="fsm">${esc(p.type)} · ${esc(p.gov)}، ${esc(p.area)}${num(p.size)?` · <span class="num">${fmt(p.size)}</span> م²`:''}</span><b class="fsp">${IQD(p.price)}</b><span class="btn gold sm">التفاصيل</span></div></article>`}).join('')}
 ${F.length>1?`<button class="fsn prev" data-fsgo="-1" aria-label="السابق">›</button><button class="fsn next" data-fsgo="1" aria-label="التالي">‹</button><div class="fsd">${F.map((_,i)=>`<button data-fsdot="${i}" aria-label="عقار ${i+1}"></button>`).join('')}</div>`:''}</div>`}
function applyFs(){document.querySelectorAll('.fs').forEach(st=>{const L=[...st.querySelectorAll('.fsl')],n=L.length;if(!n)return;const cur=((UI.fi%n)+n)%n;
 st.style.setProperty('--hw',st.offsetWidth/2+'px');st.style.setProperty('--R',Math.round(st.offsetWidth*.55)+'px');st.style.setProperty('--sp',(num(S.settings.featSpeed)||5)+'s');
 L.forEach((el,i)=>{let o=i-cur;if(o>n/2)o-=n;if(o<-n/2)o+=n;const a=Math.abs(o),far=a>2;el.style.setProperty('--o',far?Math.sign(o)*3:o);el.style.setProperty('--a',far?3:a);el.dataset.o=far?'far':String(o);el.setAttribute('aria-hidden',o!==0);el.tabIndex=o===0?0:-1});
 st.querySelectorAll('[data-fsdot]').forEach((d,i)=>d.classList.toggle('on',i===cur))})}
let fsTimer=null,fsHold=false;
function fsRestart(){clearInterval(fsTimer);fsTimer=setInterval(()=>{if(fsHold||document.hidden||!document.querySelector('.fs'))return;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;UI.fi++;applyFs()},(num(S.settings.featSpeed)||5)*1000)}
fsRestart();
document.addEventListener('pointerover',e=>{fsHold=!!e.target.closest?.('.fs')});
document.addEventListener('click',e=>{const g=e.target.closest('[data-fsgo],[data-fsdot]');if(!g)return;e.stopPropagation();if(g.dataset.fsgo)UI.fi+=+g.dataset.fsgo;else UI.fi=+g.dataset.fsdot;applyFs();fsRestart()},true);
let fsX=null;document.addEventListener('pointerdown',e=>{if(e.target.closest('.fs'))fsX=e.clientX});
document.addEventListener('pointerup',e=>{if(fsX==null)return;const dx=e.clientX-fsX;fsX=null;if(Math.abs(dx)>45){UI.fi+=dx>0?1:-1;applyFs();fsRestart();fsSwiped=Date.now()}});
let fsSwiped=0;document.addEventListener('click',e=>{const s=e.target.closest('.fsl');if(s&&s.dataset.o!=='0'){e.stopPropagation();e.preventDefault();UI.fi=+s.dataset.i;applyFs();fsRestart()}},true);
document.addEventListener('click',e=>{if(Date.now()-fsSwiped<350&&e.target.closest('.fs')){e.stopPropagation();e.preventDefault()}},true);
addEventListener('resize',applyFs);

function fsPreview(m){const note=featuredList().length?'':'<p class="small mute" style="margin:0 0 8px">ماكو عقار معلّم «مميز»، فالسلايدر يعرض أحدث العقارات المتاحة. علّم العقارات اللي تريدها بنموذج العقار حتى تطلع هي بداله.</p>';return note+(m==='ticker'?(ticker()||'<div class="note small">ماكو عقارات منشورة بعد.</div>')+'<p class="small mute">الشريط يطلع أعلى صفحة الزبون.</p>':featStage(m,true))}
function offPv(){const pv=$('#offPv'),inp=$('#f_officeLL');if(!pv||!inp)return;const ll=parseLL(inp.value);pv.innerHTML=ll?`<div class="small t-ok">✓ النقطة محددة: <span class="num">${ll[0].toFixed(5)}, ${ll[1].toFixed(5)}</span></div>${mapEmbed(ll)}`:inp.value.trim()?'<div class="small t-bad">الصيغة مو صحيحة — اكتبها مثل: 31.8356, 47.1450</div>':''}

/* stale-listing reminders */
const STALE_DAYS=30;
const pAge=p=>Math.floor((Date.now()-(p.createdAt||p.updatedAt||Date.now()))/864e5);
const isStale=p=>!isDone(p)&&pAge(p)>=STALE_DAYS&&!(num(p.snoozeUntil)>Date.now());
const staleList=()=>S.properties.filter(isStale).sort((a,b)=>pAge(b)-pAge(a));
function staleCard(){const L=staleList();if(!L.length)return'';
 return`<div class="card remind" role="region" aria-label="تذكيرات"><div class="row between"><h3>⏰ تذكير: ${L.length} ${L.length===1?'عقار':'عقارات'} صار لها أكثر من شهر وما انباعت</h3><button class="btn sm" data-stalego>عرضها بالعقارات</button></div>
 <div class="rlist">${L.slice(0,8).map(p=>`<div class="ritem"><div><b>${esc(p.title)}</b><div class="small mute"><span class="num">${esc(p.code)}</span> · ${esc(p.purpose)} · ${IQD(p.price)} · ${esc(p.status)}</div></div>
 <span class="rdays"><b class="num">${pAge(p)}</b> يوم</span><div class="row" style="flex-wrap:nowrap"><button class="btn sm gold" data-prop="${p.id}">فتح</button><button class="btn sm" data-snooze="${p.id}" title="ما يذكرك بيه لمدة أسبوعين">تأجيل أسبوعين</button></div></div>`).join('')}</div>
 ${L.length>8?`<p class="small mute" style="margin:8px 0 0">و${L.length-8} غيرها…</p>`:''}<p class="small mute" style="margin:8px 0 0">فكّر تراجع السعر، تحدّث الصور، أو تعلّمه "مميز" حتى يطلع بأعلى صفحة الزبون.</p></div>`}

function parseLL(u){u=String(u||'').trim();if(!u)return null;let m=/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/.exec(u)||/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(u)||/[?&](?:q|query|ll|destination|center)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i.exec(u)||/^(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)$/.exec(u);
 return m?[+m[1],+m[2]]:null}
const mapOpen=(ll,url,q)=>url&&/^https?:\/\//.test(url)?url:ll?`https://www.google.com/maps?q=${ll[0]},${ll[1]}`:`https://www.google.com/maps/search/${encodeURIComponent(q||'')}`;
const mapEmbed=(ll,q)=>`<iframe class="mapf" title="الموقع على الخريطة" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${ll?ll[0]+','+ll[1]:encodeURIComponent(q||'')}&z=${ll?16:14}&hl=ar&output=embed"></iframe>`;

  navigator.geolocation.getCurrentPosition(pos=>{inp.value=pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6);draw();b.disabled=false;b.lastChild.textContent=' إضافة موقعي الحالي';toast('انضاف موقعك الحالي')},

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}}};
let VID=LS.get('mr_vid');if(!VID){VID='v'+uid();LS.set('mr_vid',VID)}

const LV=[];// local-only events when there is no db

const isAdminDevice=()=>LS.get('mr_admin')==='1';
function envInfo(){const ua=navigator.userAgent||'',w=Math.min(screen.width,screen.height);
 const dev=/iPad|Tablet/i.test(ua)||(/Android/i.test(ua)&&!/Mobile/i.test(ua))?'تابلت':/Mobi|iPhone|Android/i.test(ua)||w<600?'موبايل':'حاسبة';
 const os=/iPhone|iPad|iOS/i.test(ua)?'iOS':/Android/i.test(ua)?'Android':/Windows/i.test(ua)?'Windows':/Mac OS/i.test(ua)?'macOS':/Linux/i.test(ua)?'Linux':'أخرى';
 const br=/Instagram/i.test(ua)?'Instagram':/FBAN|FBAV|FB_IAB/i.test(ua)?'Facebook':/Edg\//.test(ua)?'Edge':/OPR\//.test(ua)?'Opera':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':/Firefox\//.test(ua)?'Firefox':'أخرى';
 const qs=new URLSearchParams(location.search);let src=qs.get('utm_source')||qs.get('src')||'';
 if(!src){if(/FBAN|FBAV|FB_IAB/i.test(ua)||qs.get('fbclid'))src='facebook';else if(/Instagram/i.test(ua))src='instagram';else if(qs.get('gclid'))src='google ads';else{try{const r=document.referrer&&new URL(document.referrer).hostname;src=r&&r!==location.hostname?r.replace(/^www\./,''):'مباشر'}catch(e){src='مباشر'}}}
 return{dev,os,br,src,camp:qs.get('utm_campaign')||'',lang:navigator.language||'',scr:screen.width+'x'+screen.height}}
async function track(type,x={}){if(location.hash!=='#store'||isAdminDevice())return;

 pixelEvent(type,pr);const d=await dbReady;
 if(!d){LV.push(ev);return}try{await d.collection('visits').doc(uid()).set(ev)}catch(e){}}

 try{if(s.metaPixel){!function(f,b,e,v,n,t,u){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;u=b.getElementsByTagName(e)[0];u.parentNode.insertBefore(t,u)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',s.metaPixel);fbq('track','PageView')}}catch(e){}
 try{if(s.gtagId){const t=document.createElement('script');t.async=true;t.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(s.gtagId);document.head.append(t);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',s.gtagId)}}catch(e){}}

UI.vr=30;
async function loadStats(){UI.vsLoading=true;const since=ymd(new Date(Date.now()-(UI.vr-1)*864e5));

 catch(e){UI.vs=[];UI.vsErr='تعذر تحميل الإحصائيات حالياً.'}UI.vsLoading=false;if(UI.sec==='stats')render()}

function stats(){const top=`<div class="row between"><div><h1>إحصائيات الزوار</h1><p class="mute">زيارات صفحة الزبون ومشاهدات العقارات والتواصل — زيارات الإدارة ما تنحسب.</p></div>
 <div class="row"><select id="vr" aria-label="الفترة" style="width:auto">${opts([[7,'آخر 7 أيام'],[30,'آخر 30 يوم'],[90,'آخر 90 يوم'],[365,'آخر سنة']],UI.vr)}</select><button class="btn" data-vreload>تحديث</button></div></div>`;
 if(!UI.vs)return top+'<div class="empty">جاري تحميل الإحصائيات…</div>';
 const L=UI.vs,V=L.filter(x=>x.type==='visit'),W=L.filter(x=>x.type==='view'),C=L.filter(x=>x.type==='contact');
 const uniq=new Set(L.map(x=>x.vid)).size,ret=countBy(V,x=>x.vid).filter(x=>x[1]>1).length,contactors=new Set(C.map(x=>x.vid)).size;
 const days=[];for(let i=Math.min(UI.vr,30)-1;i>=0;i--)days.push(ymd(new Date(Date.now()-i*864e5)));
 const dv=days.map(d=>({d,v:V.filter(x=>x.date===d).length,w:W.filter(x=>x.date===d).length})),mx=Math.max(1,...dv.map(x=>x.v+x.w));
 const hours=Array.from({length:24},(_,h)=>L.filter(x=>x.type!=='contact'&&x.hour===h).length),hm=Math.max(1,...hours);
 const props=countBy(W,x=>x.pid).map(([pid,n])=>{const p=byId('properties',pid),ex=W.find(x=>x.pid===pid);return{pid,n,u:new Set(W.filter(x=>x.pid===pid).map(x=>x.vid)).size,c:C.filter(x=>x.pid===pid).length,code:p?.code||ex?.code||'',title:p?.title||ex?.title||'عقار محذوف'}});
 const vis=[...countBy(L,x=>x.vid)].map(([vid])=>{const E=L.filter(x=>x.vid===vid).sort((a,b)=>a.ts-b.ts),last=E[E.length-1];
  return{vid,first:E[0].ts,last:last.ts,visits:new Set(E.map(x=>x.sid)).size,views:[...new Set(E.filter(x=>x.type==='view').map(x=>x.code||x.title))],contact:E.some(x=>x.type==='contact'),src:E[0].src,dev:E[0].dev+' · '+E[0].os,camp:E.find(x=>x.camp)?.camp||''}}).sort((a,b)=>b.last-a.last);
 const t=ts=>{const d=new Date(ts);return dmy(ymd(d))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
 return top+(UI.vsErr?`<div class="note">${UI.vsErr}</div>`:'')+`
 <div class="grid g4"><div class="card kpi"><span>الزيارات</span><b class="num">${fmt(V.length)}</b><span>${fmt(uniq)} زائر مختلف</span></div>
 <div class="card kpi"><span>مشاهدات العقارات</span><b class="num">${fmt(W.length)}</b><span>${V.length?(W.length/V.length).toFixed(1):0} مشاهدة لكل زيارة</span></div>
 <div class="card kpi"><span>تواصل (واتساب واتصال)</span><b class="num">${fmt(C.length)}</b><span>${uniq?Math.round(contactors/uniq*100):0}% من الزوار تواصلوا</span></div>
 <div class="card kpi"><span>زوار رجعوا مرة ثانية</span><b class="num">${fmt(ret)}</b><span>من ${fmt(uniq)} زائر</span></div></div>
 <div class="card"><div class="row between"><h3>الزيارات والمشاهدات يومياً</h3><span class="small mute">الذهبي: زيارات + مشاهدات</span></div>
 <div class="bars">${dv.map(x=>`<div title="${dmy(x.d)}: ${x.v} زيارة، ${x.w} مشاهدة" style="height:${(x.v+x.w)/mx*100}%"></div>`).join('')}</div>
 <div class="row between small mute"><span class="num">${dmy(days[0])}</span><span class="num">${dmy(days[days.length-1])}</span></div></div>
 <div class="card"><h3>العقارات الأكثر مشاهدة</h3>${props.length?`<div class="scroll"><table class="stack"><thead><tr><th>الكود</th><th>العقار</th><th class="n">مشاهدات</th><th class="n">زوار مختلفين</th><th class="n">تواصل</th></tr></thead><tbody>${props.slice(0,15).map(x=>`<tr><td class="num">${esc(x.code)}</td><td>${esc(x.title)}</td><td class="n num">${fmt(x.n)}</td><td class="n num">${fmt(x.u)}</td><td class="n num">${fmt(x.c)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mute small">ماكو مشاهدات بعد</p>'}</div>
 <div class="grid g3">${listCard('مصادر الزوار',countBy(V,x=>x.src),V.length)}${listCard('الأجهزة',countBy(V,x=>x.dev),V.length)}${listCard('أنظمة التشغيل',countBy(V,x=>x.os),V.length)}</div>
 <div class="grid g2">${listCard('الحملات الإعلانية (utm_campaign)',countBy(V,x=>x.camp),V.length)}<div class="card"><h3>أوقات النشاط خلال اليوم</h3><p class="small mute" style="margin:4px 0 0">أنسب وقت لنشر الإعلان هو وقت الذروة.</p>
 <div class="bars" style="height:110px">${hours.map((n,h)=>`<div title="الساعة ${h}:00 — ${n}" style="height:${n/hm*100}%"></div>`).join('')}</div><div class="row between small mute"><span class="num">00</span><span class="num">12</span><span class="num">23</span></div></div></div>
 <div class="card"><h3>سجل الزوار</h3><p class="small mute" style="margin:4px 0 8px">كل زائر له رقم ثابت على جهازه، حتى تعرف شنو شاف ومنين إجه وهل تواصل. الأسماء ما تبين إلا إذا تواصل الزبون وياكم.</p>
 ${vis.length?`<div class="scroll"><table class="stack"><thead><tr><th>الزائر</th><th>آخر نشاط</th><th class="n">زيارات</th><th>العقارات اللي شافها</th><th>المصدر</th><th>الجهاز</th><th>تواصل</th></tr></thead><tbody>${vis.slice(0,60).map(v=>`<tr><td class="num">#${esc(v.vid.slice(-5).toUpperCase())}</td><td class="num">${t(v.last)}</td><td class="n num">${v.visits}</td><td>${v.views.length?v.views.map(esc).join('، '):'<span class="mute">—</span>'}</td><td>${esc(v.src)}${v.camp?`<div class="small mute">${esc(v.camp)}</div>`:''}</td><td>${esc(v.dev)}</td><td>${v.contact?'<span class="tag t-ok">نعم</span>':'<span class="mute">لا</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mute small">ماكو زوار بالفترة هذي</p>'}</div>
 <div class="note small"><b>للإعلانات:</b> أضف رقم بكسل ميتا أو Google من الإعدادات، وبعدها كل زائر لصفحة الزبون ينضاف لجمهوركم بإدارة الإعلانات وتگدرون تستهدفوه بإعلان ثاني. وحتى تعرف أي إعلان جاب الزبون، خلي رابط الإعلان بهالشكل: <span class="num">…?utm_source=facebook&amp;utm_campaign=اسم-الحملة#store</span></div>`}
document.addEventListener('change',e=>{if(e.target.id==='vr'){UI.vr=+e.target.value;UI.vs=null;render()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-vreload]')){UI.vs=null;render()}});

/* ---------- events ---------- */
document.addEventListener('click',e=>{const sp=e.target.closest('[data-spv]');if(sp){UI.sp=sp.dataset.spv;render();return}
 const t=e.target.closest('[data-sec],[data-act],[data-prop],[data-view],[data-client],[data-partner],[data-deltx],[data-ctp],[data-cte],[data-ctd],[data-blank]');if(!t)return;
 if(t.dataset.sec){UI.sec=t.dataset.sec;UI.q='';if(t.dataset.sec!=='ctedit')UI.ct=null;if(t.dataset.sec!=='props')UI.stale=false;if(t.dataset.sec==='stats')UI.vs=null;closeModal();render();scrollTo(0,0);return}
 if(t.dataset.ctp)return printView(byId('contracts',t.dataset.ctp));if(t.dataset.blank)return printView({type:t.dataset.blank,comm:t.dataset.blank==='sale'?2:''});
 if(readOnly&&(t.dataset.act||t.dataset.deltx||t.dataset.cte||t.dataset.ctd))return toast('ما عندك صلاحية تعديل');
 if(t.dataset.cte)return openCt({...byId('contracts',t.dataset.cte),id:t.dataset.cte});if(t.dataset.ctd){const id=t.dataset.ctd;ask('حذف هذا العقد؟','حذف').then(y=>{if(y)drop('contracts',id).then(()=>toast('انحذف العقد'))});return}
 const a=t.dataset.act;if(a==='newProp')propForm();else if(a==='newTx')txForm();else if(a==='newClient')clientForm();else if(a==='newPartner')partnerForm();else if(a==='newSale')openCt({type:'sale'});else if(a==='newRent')openCt({type:'rent'});
 else if(t.dataset.prop)propDetail(t.dataset.prop);else if(t.dataset.view)storeDetail(t.dataset.view);else if(t.dataset.client)clientForm(byId('clients',t.dataset.client));else if(t.dataset.partner)partnerDetail(t.dataset.partner);
 else if(t.dataset.deltx){const id=t.dataset.deltx;ask('حذف هذه الحركة؟','حذف').then(y=>{if(y)drop('tx',id).then(()=>toast('انحذفت'))})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('article[tabindex]'))e.target.click()});
document.addEventListener('input',e=>{const id=e.target.id;if(!id||e.target.closest('#modal'))return;
 if(['q','ft','fs','fg','fk','sq','st','sp','sg'].includes(id)){UI[id]=e.target.value;
  if(id==='q'&&UI.sec==='props'){$('#plist').innerHTML=propCards(filteredProps(),true);return}
  if(id==='sq'){render();return}render()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='setf')return;e.preventDefault();const d=formData(e.target);
 const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);await putSettings({officeName:d.officeName,phone:d.phone,whatsapp:d.whatsapp,ctTag:d.ctTag,ctAddr:d.ctAddr,ctMgr:d.ctMgr,ctPhone:d.ctPhone,metaPixel:d.metaPixel.trim(),featMode:d.featMode,featSpeed:Math.min(30,Math.max(2,num(d.featSpeed)||5)),about:d.about,tiktok:d.tiktok.trim(),instagram:d.instagram.trim(),facebook:d.facebook.trim(),mapsUrl:d.mapsUrl.trim(),officeLL:(d.officeLL||'').trim(),gtagId:d.gtagId.trim(),incomeCats:lines(d.incomeCats),expenseCats:lines(d.expenseCats)});toast('انحفظت الإعدادات');fsRestart()});
render();
}
</script>
